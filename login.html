<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - The One Page</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Encabezado y Navegación Principal -->
    <header class="header-main">
        <div class="logo-container">
            <a href="index.html" class="brand-logo">📖 The One Page</a>
        </div>

        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="user-cart-actions">
            <a href="login.html" class="btn-link active">Iniciar sesión</a>
            <a href="registro.html" class="btn-link">Registrarse</a>
            <a href="carrito.html" class="cart-btn">🛒 Cart (<span>0</span>)</a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
        <section class="login-section">
            <div class="login-card">
                <h1>INICIAR SESIÓN</h1>
                <p>Ingresa a tu cuenta de The One Page.</p>

                <form id="login-form" novalidate>
                    <!-- Campo Email -->
                    <div class="form-group">
                        <label for="email">Correo Electrónico (*):</label>
                        <input 
                            type="email" 
                            id="correo" 
                            name="correo" 
                            placeholder="Ingresa tu correo electrónico"
                            maxlength="100"
                            required
                        >
                        <span class="error-msg" id="error-correo"></span>
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="form-group">
                        <label for="contrasena">Contraseña (*):</label>
                        <input 
                            type="password" 
                            id="contrasena" 
                            name="contrasena" 
                            placeholder="Ingresa tu contraseña"
                            minlength="8"
                            required
                        >
                        <span class="error-msg" id="error-contrasena"></span>
                    </div>

                    <!-- Botón de Iniciar Sesión -->
                    <button type="submit" class="btn-primary btn-block">Iniciar Sesión</button>
                </form>
            </div>
        </section>
    </main>

    <!-- pie de página -->
    <footer class="footer-main">
        <div class="footer-container">
            <div class="footer-info">
                <h3>The One Page</h3>
                <p>&copy; 2026 Todos los derechos reservados.</p>
            </div>

            <div class="newsletter-box">
                <h4>¡Mantente en contacto! Únete a nuestro buzón de noticias.</h4>
                <form id="newsletter-form">
                    <input type="email" placeholder="Ingresa tu correo" required>
                    <button type="submit" class="btn-secundary">Suscribirse</button>
                </form>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/cart.js"></script>
    <script src="js/validations.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const inputCorreo = document.getElementById('correo');
            const inputContrasena = document.getElementById('contrasena');

            inputCorreo.addEventListener('input', () => {
                const res = validarCorreo(inputCorreo.value); 
                mostrarError("correo", res.valido ? "" : res.mensaje);
            });

            inputContrasena.addEventListener('input', () => {
                const res = validarContrasena(inputContrasena.value);
                mostrarError("contrasena", res.valido ? "" : res.mensaje);
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Evita el envío del formulario

                const resCorreo = validarCorreo(inputCorreo.value);
                const resContrasena = validarContrasena(inputContrasena.value);

                mostrarError("correo", resCorreo.valido ? "" : resCorreo.mensaje);
                mostrarError("contrasena", resContrasena.valido ? "" : resContrasena.mensaje);

                if (resCorreo.valido && resContrasena.valido) {
                    alert("¡Inicio de sesión exitoso! Bienvenido a The One Page.");
                    form.reset();
                    limpiarError("correo");
                    limpiarError("contrasena");
                }
            });
        });
    </script>
</body>
</html>
